# StyleMyFit Shopify app configuration - TEST

client_id = "53016a908652c8b04605e4863107576a"
name = "stylemyfit-test"
handle = "stylemyfit-test"
application_url = "https://shopify.dev/apps/default-app-home"
embedded = true

[build]
automatically_update_urls_on_dev = false

[access_scopes]
scopes = "read_products"

[auth]
redirect_urls = [ "https://shopify.dev/apps/default-app-home/api/auth" ]

[webhooks]
api_version = "2027-01"

# Storefront calls /apps/smf/chek_prd/?pageUrl=...
# Shopify signs it and forwards to <url>/chek_prd/?pageUrl=...&shop=...&signature=...
[app_proxy]
url = "https://be.test.stylemyfit.com/api/v1/plugin"
prefix = "apps"
subpath = "smf"
